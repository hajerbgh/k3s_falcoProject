customRules:
  custom-rules.yaml: |-
    - rule: Network Tool Spawned In Container
      desc: Detect use of network tools like wget, curl, or nmap inside a container.
      condition: spawned_process and container and proc.name in (wget, curl, nc, nmap, netcat)
      output: "Network tool launched inside container (user=%user.name command=%proc.cmdline pod=%k8s.pod.name ns=%k8s.ns.name image=%container.image.repository)"
      priority: WARNING
      tags: [mitre_command_and_control, T1105]

    - rule: Sensitive File Read Custom MITRE
      desc: Detect reading of sensitive files like shadow or passwd with MITRE tagging.
      condition: open_read and container and fd.name startswith /etc/shadow
      output: "Sensitive file read detected (user=%user.name file=%fd.name command=%proc.cmdline pod=%k8s.pod.name ns=%k8s.ns.name)"
      priority: WARNING
      tags: [mitre_credential_access, T1003.008]

    - rule: Potential Container Escape Privileged or Socket
      desc: Detect container running in privileged mode or mounting Docker socket.
      condition: container and (container.privileged=true or fd.name=/var/run/docker.sock)
      output: "Potential container escape attempt detected (pod=%k8s.pod.name ns=%k8s.ns.name image=%container.image.repository)"
      priority: CRITICAL
      tags: [mitre_privilege_escalation, T1611]

# Activation de Falcosidekick pour collecter et router les alertes
falcosidekick:
  enabled: true
  webui:
    enabled: true
loki:
    hosturl: "http://loki.monitoring.svc.cluster.local:3100" # Adapte selon ton installation Loki, ou commente si tu fais du Slack/Webhook direct
stdout:
    enabled: true
